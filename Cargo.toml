[workspace]
members = ["dnas/*/zomes/coordinator/*", "dnas/*/zomes/integrity/*", "crates/*"]
resolver = "2"

[workspace.dependencies]
hdi = "0.7.0"
hdk = "0.6.0"
serde = "1"
paste = "1.0"
hc_prefix_index = "0.14.0"
holochain_serialized_bytes = "0.0.56"


[workspace.dependencies.echoes]
path = "dnas/eko/zomes/coordinator/echoes"

[workspace.dependencies.echoes_integrity]
path = "dnas/eko/zomes/integrity/echoes"

[workspace.dependencies.echo_types]
path = "crates/echo_types"


[workspace.dependencies.profiles]
path = "dnas/eko/zomes/coordinator/profiles"

[workspace.dependencies.profiles_integrity]
path = "dnas/eko/zomes/integrity/profiles"

[workspace.dependencies.credits]
path = "dnas/eko/zomes/coordinator/credits"

[workspace.dependencies.credits_integrity]
path = "dnas/eko/zomes/integrity/credits"

[workspace.dependencies.credit_types]
path = "crates/credit_types"

[workspace.dependencies.ledger_types]
path = "crates/ledger_types"


[workspace.dependencies.hc_link_pagination]
path = "crates/hc_link_pagination"

[workspace.dependencies.hc_zome_input]
path = "crates/hc_zome_input"
