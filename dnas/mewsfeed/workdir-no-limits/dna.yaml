---
# Same zomes as ../workdir/dna.yaml, with character limits removed.
#
# NOTE: this manifest previously listed follows_integrity, likes_integrity,
# agent_pins_integrity and ping. Those zome crates no longer exist in this
# repo (follows/likes/pins are now link types inside the mews zome), so
# `npm run build:happ` failed while packing this DNA. Rewritten to match the
# zomes that are actually built.
#
# Zome ORDER matters: mews/src/mew.rs matches on a hardcoded ZomeIndex(1) when
# validating mewmews, so mews_integrity must stay second and credits_integrity
# must stay last.
manifest_version: "0"
name: mewsfeed
integrity:
  network_seed: ~
  properties:
    mew_characters_min: ~
    mew_characters_max: ~
    credit_characters_min: ~
    credit_characters_max: ~
  zomes:
    - name: profiles_integrity
      hash: ~
      path: "../../../target/wasm32-unknown-unknown/release/profiles_integrity.wasm"
      dependencies: ~
    - name: mews_integrity
      hash: ~
      path: "../../../target/wasm32-unknown-unknown/release/mews_integrity.wasm"
      dependencies: ~
    - name: credits_integrity
      hash: ~
      path: "../../../target/wasm32-unknown-unknown/release/credits_integrity.wasm"
      dependencies: ~
coordinator:
  zomes:
    - name: profiles
      hash: ~
      path: "../../../target/wasm32-unknown-unknown/release/profiles.wasm"
      dependencies:
        - name: profiles_integrity
    - name: mews
      hash: ~
      path: "../../../target/wasm32-unknown-unknown/release/mews.wasm"
      dependencies:
        - name: mews_integrity
        - name: profiles_integrity
    - name: credits
      hash: ~
      path: "../../../target/wasm32-unknown-unknown/release/credits.wasm"
      dependencies:
        - name: credits_integrity
